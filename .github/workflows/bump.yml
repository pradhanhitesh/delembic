name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 0.2.0)"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in pyproject.toml and __init__.py
        run: |
          python - <<'EOF'
          import re, sys

          v = "${{ github.event.inputs.version }}"

          with open("pyproject.toml") as f:
              content = f.read()
          content = re.sub(r'^version = "[^"]+"', f'version = "{v}"', content, count=1, flags=re.MULTILINE)
          with open("pyproject.toml", "w") as f:
              f.write(content)

          with open("src/delembic/__init__.py") as f:
              content = f.read()
          content = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{v}"', content)
          with open("src/delembic/__init__.py", "w") as f:
              f.write(content)

          print(f"Bumped to {v}")
          EOF

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/delembic/__init__.py
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push
          git push --tags
