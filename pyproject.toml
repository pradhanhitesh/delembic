[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delembic"
version = "0.2.0"
description = "Data migration framework for versioning ETL and data operations alongside Alembic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { email = "htshpradhan5@gmail.com" }
]
dependencies = [
    "click>=8.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
delembic = "delembic.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delembic"]
